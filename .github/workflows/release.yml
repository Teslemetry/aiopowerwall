name: Release gate & publish

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to build/test/publish with
        required: false
        type: string
        default: "3.13"
      pypi-project-url:
        description: PyPI project URL shown on the environment deployment
        required: true
        type: string
      environment-name:
        description: Protected GitHub environment gating the publish step
        required: false
        type: string
        default: pypi

jobs:
  gate:
    name: Full CI gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Ruff
        run: uv run ruff check src/aiopowerwall
      - name: Mypy
        run: uv run mypy src/aiopowerwall
      - name: Pytest
        run: uv run pytest -q

  build:
    name: Build distribution
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --python ${{ inputs.python-version }}
      - name: Build
        run: uv build
      - name: Check distribution
        run: uvx twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.pypi-project-url }}
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Reusable workflow: attestations sign under the top-level workflow identity, which PyPI's publisher-identity check rejects with a 400.
          attestations: false

  github-release:
    name: Upload distribution to GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # mandatory for making GitHub Releases
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ github.ref_name }}'
          --repo '${{ github.repository }}'
          --generate-notes
      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'
